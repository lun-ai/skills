<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: an editorial research post on warm paper. One reading column (~66ch) under a meta line
   and a large serif title; figures, charts and tables step out to a wider measure; the series
   closes the page as stacked cards. Deliberately one light theme. Generated from markdown by darkroom. */
:root{
  color-scheme:light;
  --bg:#f6f4ee; --paper:#fffdf9; --ink:#1e1d1a; --muted:#6a665d; --rule:#e2ddd2;
  --accent:#a9502c; --accent-soft:#f1e4db;
  --pos:#3f6b3a; --pos-bg:#e5ecdd; --null:#6a665d; --null-bg:#ece9e1;
  --neg:#a33a2c; --neg-bg:#f5e1dc; --pre:#8a6418; --pre-bg:#f3e9d3;
  --s0:#aaa498; --s1:#a9502c; --s2:#3e6a88; --s3:#6f7f38; --s4:#8a6a9e; --grid:#e8e3d8;
  --f-display:"Newsreader", Georgia, "Times New Roman", serif;
  --f-body:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18.5px;line-height:1.7;-webkit-font-smoothing:antialiased}
.page{max-width:900px;margin:0 auto;padding-inline:24px;padding-block:72px 96px}
@media (max-width:600px){.page{padding-inline:16px;padding-block:40px 64px}body{font-size:17.5px}}
.col{max-width:66ch;margin-inline:auto}

header.post{margin-bottom:40px}
.meta{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.meta .kind{color:var(--accent);font-weight:600}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,5.4vw,54px);line-height:1.08;letter-spacing:-.012em;text-wrap:balance;margin:18px 0 14px}
.series-line{font-family:var(--f-display);font-style:italic;font-size:20px;color:var(--muted);margin:0 0 26px}
h2{font-family:var(--f-display);font-weight:500;font-size:30px;line-height:1.2;letter-spacing:-.005em;text-wrap:balance;margin:64px 0 12px}
h3{font-family:var(--f-body);font-weight:600;font-size:19.5px;line-height:1.35;margin:40px 0 6px}
p,li{text-wrap:pretty}
p{margin:0 0 1.05em}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
strong{font-weight:600}
code{font-family:var(--f-mono);font-size:.82em;background:var(--accent-soft);padding:1px 5px;border-radius:3px;overflow-wrap:anywhere}

nav.contents{font-size:15.5px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:14px 0 16px}
nav.contents .label{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
nav.contents ol{margin:0;padding:0;list-style:none;display:grid;gap:4px}
nav.contents a{color:var(--ink);text-decoration:none}
nav.contents a:hover,nav.contents a:focus-visible{color:var(--accent);text-decoration:underline}
nav.contents li.toc-h3{padding-left:1.2em;font-size:14.5px;color:var(--muted)}

.banner{font-size:15.5px;line-height:1.55;background:var(--pre-bg);border-radius:6px;padding:12px 16px;margin:0 0 24px}

article > *:not(.tbl):not(figure){max-width:66ch;margin-inline:auto}
article ul,article ol{padding-left:1.25em;margin:0 auto 1.05em}
article li{margin:.2em 0}
.tbl{overflow-x:auto;margin:28px 0}
table{border-collapse:collapse;font-size:15px;line-height:1.45;min-width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--ink);white-space:nowrap}
figure{margin:36px 0}
figure.img{background:#fff;border:1px solid var(--rule);border-radius:4px;padding:12px}
figure.img img{display:block;width:100%;height:auto}
figure.chartbox{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:18px}
figure.chartbox.wide{overflow-x:auto}
figure.chartbox.wide svg{min-width:680px}
figcaption{font-size:14.5px;line-height:1.5;color:var(--muted);margin-top:10px}
svg.chart{display:block;width:100%;height:auto;font-family:var(--f-body)}
svg .tick{font-size:11.5px;fill:var(--muted);font-family:var(--f-mono)}
svg .label{font-size:12.5px;fill:var(--ink)}
svg .axis{font-size:12.5px;fill:var(--ink)}
svg .title{font-size:13.5px;font-weight:600;fill:var(--ink)}
svg .val{font-size:11px;fill:var(--ink);font-family:var(--f-mono)}
svg .grid{stroke:var(--grid);stroke-width:1}
svg .ref{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 4}
svg .ref2{stroke:var(--muted);stroke-width:1;stroke-dasharray:1 4}
svg .line{fill:none;stroke-width:2.2}
svg .dot{stroke:var(--paper);stroke-width:1.2}
svg .s0{fill:var(--s0);stroke:var(--s0)} svg .s1{fill:var(--s1);stroke:var(--s1)}
svg .s2{fill:var(--s2);stroke:var(--s2)} svg .s3{fill:var(--s3);stroke:var(--s3)} svg .s4{fill:var(--s4);stroke:var(--s4)}
svg .line{fill:none}
svg .bar{stroke:none}
svg g:hover .bar{opacity:.8}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--muted);margin-top:8px}
.legend .k{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend .k.s0{background:var(--s0)} .legend .k.s1{background:var(--s1)} .legend .k.s2{background:var(--s2)} .legend .k.s3{background:var(--s3)} .legend .k.s4{background:var(--s4)}
.legend .k.ref{height:0;border-top:2px dashed var(--muted);border-radius:0}
.legend .k.ref2{height:0;border-top:2px dotted var(--muted);border-radius:0}
.callout{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:14px 18px;margin:28px auto;font-size:17px}
.callout p{margin:6px 0}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:4px;margin-right:6px;vertical-align:2px}
.tag.positive{color:var(--pos);background:var(--pos-bg)} .tag.negative{color:var(--neg);background:var(--neg-bg)}
.tag.null,.tag.note{color:var(--null);background:var(--null-bg)} .tag.caveat{color:var(--accent);background:var(--accent-soft)}
.tag.preliminary{color:var(--pre);background:var(--pre-bg)}

nav.series{margin-top:80px;padding-top:28px;border-top:1px solid var(--rule)}
nav.series h2{font-size:24px;margin:0 0 18px}
nav.series ol{list-style:none;padding:0;margin:0;display:grid;gap:12px}
nav.series li{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:16px 20px;font-family:var(--f-display);font-size:20px;line-height:1.3}
nav.series li a{color:var(--ink);text-decoration:none}
nav.series li a:hover,nav.series li a:focus-visible{color:var(--accent);text-decoration:underline}
nav.series li[aria-current]{border-color:var(--accent)}
nav.series .n{display:block;font-family:var(--f-body);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
nav.series em{font-family:var(--f-body);font-size:14px}
footer.post{font-size:14px;color:var(--muted);margin-top:40px}
footer.post a{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

<div class="page">
  <header class="post col">
    <div class="meta">{{META}}</div>
    <h1>{{TITLE}}</h1>
    {{SERIESLINE}}
    {{BANNER}}
    <nav class="contents" aria-label="Contents"><div class="label">In this post</div><ol>{{TOC}}</ol></nav>
  </header>
  <article>
{{BODY}}
  </article>
  {{SERIESNAV}}
  <footer class="post col">{{FOOTER}}</footer>
</div>
